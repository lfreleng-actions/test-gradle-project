# Configuration for the SonarQube Scanner CLI.
#
# Gradle analysis mode does NOT read this file: the SonarQube Gradle
# plugin derives sources, tests, binaries and coverage paths from the
# Gradle project model. The properties below exist so the CLI scanner,
# which has no such model, can analyse this project too. Keeping both
# paths working is the point of this fixture.

sonar.organization=lfreleng-actions
sonar.projectKey=test-gradle-project
sonar.projectName=test-gradle-project

# .gitignore hides build/, which would otherwise exclude the compiled
# classes the Java analyser needs.
sonar.scm.exclusions.disabled=true

sonar.sources=core/src/main/java,app/src/main/java
sonar.tests=core/src/test/java,app/src/test/java

sonar.java.binaries=core/build/classes/java/main,app/build/classes/java/main
sonar.java.test.binaries=core/build/classes/java/test,app/build/classes/java/test

sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml,app/build/reports/jacoco/test/jacocoTestReport.xml

sonar.java.source=17
sonar.sourceEncoding=UTF-8
