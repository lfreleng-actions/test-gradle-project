# SPDX-FileCopyrightText: 2026 The Linux Foundation

version = 1
SPDX-PackageName = "test-gradle-project"
SPDX-PackageSupplier = "The Linux Foundation <releng@linuxfoundation.org>"
SPDX-PackageDownloadLocation = "https://github.com/lfreleng-actions/test-gradle-project"

# The Gradle wrapper is generated by Gradle and redistributed unmodified.
# It is not Linux Foundation work, so it is annotated here rather than
# given an LF header.
#
# The JAR is binary and cannot carry a comment at all. gradlew and
# gradlew.bat do ship an Apache-2.0 notice, but express the copyright as
# a bare "Copyright the original authors" line rather than the
# SPDX-FileCopyrightText tag REUSE requires, and editing generated files
# to add one would be undone by the next wrapper upgrade.
[[annotations]]
path = [
  "gradle/wrapper/gradle-wrapper.jar",
  "gradle/wrapper/gradle-wrapper.properties",
  "gradlew",
  "gradlew.bat",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Gradle Inc. and the original authors"
SPDX-License-Identifier = "Apache-2.0"
